name: Apply pricing import fix

on:
  push:
    branches:
      - pricing-import-dollar-fix-2026-08-28
    paths:
      - patch_pricing_import.py
      - .github/workflows/apply-pricing-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 patch_pricing_import.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate pricing controls
        run: |
          grep -q 'importAlternatePricesBtn' index.html
          grep -q 'function importAlternatePriceItems' app.js
          grep -q "normalizeProposalCurrencyInput(e.target)" app.js
      - name: Remove temporary patch files and commit
        run: |
          rm patch_pricing_import.py
          rm .github/workflows/apply-pricing-import.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html patch_pricing_import.py .github/workflows/apply-pricing-import.yml
          git commit -m "Fix alternate import and live dollar prefix"
          git push origin HEAD:pricing-import-dollar-fix-2026-08-28
