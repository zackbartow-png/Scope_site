name: Admin user creation patch
on:
  push:
    branches: [main]
    paths:
      - patch_admin_user_create.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 patch_admin_user_create.py
      - run: |
          rm patch_admin_user_create.py
          rm .github/workflows/add-admin-create-user.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html patch_admin_user_create.py .github/workflows/add-admin-create-user.yml
          git commit -m "Add admin temporary-password user creation"
          git push origin HEAD:main
