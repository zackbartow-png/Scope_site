name: Apply local PDF preview performance

on:
  push:
    branches:
      - local-pdf-preview-performance-2026-08-28
    paths:
      - patch_local_preview_performance.py
      - .github/workflows/apply-local-preview-performance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preview performance patch
        run: python3 patch_local_preview_performance.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate performance hooks
        run: |
          grep -q "native-pdf-preview-frame" app.js
          grep -q "compress:!fastPreview" app.js
          grep -q "previewIdleMs: 1200" app.js
          grep -q "scheduler?.yield" app.js
          grep -q "coverRevisionData" app.js
      - name: Remove temporary patch files and commit
        run: |
          rm patch_local_preview_performance.py
          rm .github/workflows/apply-local-preview-performance.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js styles.css patch_local_preview_performance.py .github/workflows/apply-local-preview-performance.yml
          git commit -m "Move live PDF preview to local native renderer"
          git push origin HEAD:local-pdf-preview-performance-2026-08-28
