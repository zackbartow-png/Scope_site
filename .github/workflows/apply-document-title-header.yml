name: Apply document title PDF header

on:
  push:
    branches: [document-title-pdf-header-2026-08-28]
    paths:
      - '.github/workflows/apply-document-title-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tie PDF header to Document Title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="""    // Keep the compact proposal identifier used in prior exports while leaving\n    // Marketing's fixed logo/artwork untouched.\n    doc.setFont('helvetica','bold');doc.setFontSize(12.5);setText(text);doc.text('PROPOSAL',pageW-right,.34,{align:'right'});"""
          new="""    // Use the Project Info Document Title as the compact PDF identifier.\n    // Keep it on one line and shrink only when a longer title needs the space.\n    const headerTitle=String(p.documentTitle||'Proposal').trim()||'Proposal';\n    doc.setFont('helvetica','bold');\n    let headerTitleSize=12.5;doc.setFontSize(headerTitleSize);\n    while(headerTitleSize>9&&doc.getTextWidth(headerTitle)>2.65){headerTitleSize-=.5;doc.setFontSize(headerTitleSize);}\n    setText(text);doc.text(headerTitle,pageW-right,.34,{align:'right',maxWidth:2.65});"""
          if s.count(old)!=1: raise SystemExit(f'header marker count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate title binding
        shell: bash
        run: |
          grep -q "const headerTitle=String(p.documentTitle||'Proposal')" app.js
          ! grep -q "doc.text('PROPOSAL',pageW-right,.34" app.js
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-document-title-header.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js .github/workflows/apply-document-title-header.yml
          git commit -m "Use document title in PDF header"
          git push origin HEAD:document-title-pdf-header-2026-08-28
