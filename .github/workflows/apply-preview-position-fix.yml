name: Apply preview position preservation

on:
  push:
    branches: [preserve-preview-position-2026-08-28]
    paths:
      - '.github/workflows/apply-preview-position-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preserve-preview-position-2026-08-28
          fetch-depth: 0
      - name: Preserve live PDF preview position
        shell: python
        run: |
          from pathlib import Path
          path=Path('app.js')
          text=path.read_text(encoding='utf-8')

          old_native="if(navigator.pdfViewerEnabled!==false){"
          new_native="if(false&&navigator.pdfViewerEnabled!==false){"
          if text.count(old_native)!=1:
              raise SystemExit(f'Expected one native preview branch, found {text.count(old_native)}')
          text=text.replace(old_native,new_native,1)

          old_neighbor="for(const entry of entries){if(!entry.isIntersecting)continue;const n=Number(entry.target.dataset.page||1);[n-1,n,n+1].filter(x=>x>=1&&x<=pdf.numPages).forEach(x=>renderPage(x));}"
          new_neighbor="for(const entry of entries){if(!entry.isIntersecting)continue;const n=Number(entry.target.dataset.page||1);renderPage(n);}"
          if text.count(old_neighbor)!=1:
              raise SystemExit(f'Expected one lazy neighbor render loop, found {text.count(old_neighbor)}')
          text=text.replace(old_neighbor,new_neighbor,1)

          old_margin="{root:scroller,rootMargin:'750px 0px',threshold:.01}"
          new_margin="{root:scroller,rootMargin:'180px 0px',threshold:.01}"
          if text.count(old_margin)!=1:
              raise SystemExit(f'Expected one lazy preview root margin, found {text.count(old_margin)}')
          text=text.replace(old_margin,new_margin,1)

          old_first="const first=Math.max(1,Math.min(pdf.numPages,Number(pos.page)||1));[first-1,first,first+1].filter(x=>x>=1&&x<=pdf.numPages).forEach(x=>renderPage(x));"
          new_first="const first=Math.max(1,Math.min(pdf.numPages,Number(pos.page)||1));renderPage(first);"
          if text.count(old_first)!=1:
              raise SystemExit(f'Expected one initial lazy neighbor render, found {text.count(old_first)}')
          text=text.replace(old_first,new_first,1)

          old_comment="// Fallback for browsers with their built-in PDF viewer disabled."
          new_comment="// Use the local lazy page renderer so live refreshes can preserve the exact page and scroll position."
          if text.count(old_comment)!=1:
              raise SystemExit(f'Expected one fallback comment, found {text.count(old_comment)}')
          text=text.replace(old_comment,new_comment,1)

          path.write_text(text,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate position-preserving preview hooks
        shell: python
        run: |
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          required=[
            "if(false&&navigator.pdfViewerEnabled!==false){",
            "const pos=captureLazyPreviewPosition(scroller,wrap);",
            "restoreLazyPreviewPosition(scroller,wrap,pos);",
            "rootMargin:'180px 0px'",
            "const first=Math.max(1,Math.min(pdf.numPages,Number(pos.page)||1));renderPage(first);",
            "mountLazyPdfPreview(pdf,pagesWrap,scroller,{token,isCurrent,maxWidth:400,dprCap:1})"
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing preview position hooks: '+repr(missing))
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-preview-position-fix.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js .github/workflows/apply-preview-position-fix.yml
          git commit -m "Preserve live PDF preview position"
          git push origin HEAD:preserve-preview-position-2026-08-28
