name: Apply terms heading PDF fix

on:
  push:
    branches: [terms-conditions-heading-2026-08-28]
    paths:
      - '.github/workflows/apply-terms-heading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove selected template name from PDF heading
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text(encoding='utf-8')
          old = "doc.text(`TERMS AND CONDITIONS - ${String(disclaimer.name).toUpperCase()}`,contentX+.42,y+.28,{maxWidth:contentW-.60});"
          new = "doc.text('TERMS AND CONDITIONS',contentX+.42,y+.28,{maxWidth:contentW-.60});"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one PDF terms heading, found {count}.')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate terms heading
        shell: python
        run: |
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          assert "doc.text('TERMS AND CONDITIONS',contentX+.42,y+.28" in text
          assert "TERMS AND CONDITIONS - ${String(disclaimer.name).toUpperCase()}" not in text
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-terms-heading.yml
          git config user.name "Scope Builder maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js .github/workflows/apply-terms-heading.yml
          git commit -m "Simplify PDF terms and conditions heading"
          git push origin HEAD:terms-conditions-heading-2026-08-28
